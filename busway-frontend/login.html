<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BusWay - Login</title>
  <link rel="stylesheet" href="css/login.css">
</head>
<body>
  <div class="login-wrapper">
    <div class="login-brand">
      <svg class="brand-logo" viewBox="0 0 48 48" fill="none" aria-label="BusWay logo">
        <rect width="48" height="48" rx="12" fill="#f5c400"/>
        <rect x="8" y="14" width="32" height="20" rx="4" fill="#111"/>
        <rect x="11" y="18" width="11" height="7" rx="2" fill="#f5c400"/>
        <rect x="26" y="18" width="11" height="7" rx="2" fill="#f5c400"/>
        <circle cx="14" cy="36" r="3" fill="#111" stroke="#f5c400" stroke-width="1.5"/>
        <circle cx="34" cy="36" r="3" fill="#111" stroke="#f5c400" stroke-width="1.5"/>
        <rect x="8" y="28" width="32" height="2" rx="1" fill="#f5c400" opacity="0.3"/>
      </svg>
      <div class="brand-text">
        <span class="brand-name">Bus<span class="brand-accent">Way</span></span>
        <span class="brand-tagline">Sistema de Vendas</span>
      </div>
    </div>

    <div class="login-card">
      <h1 class="login-title">Bem-vindo</h1>
      <p class="login-subtitle">Acesse com suas credenciais de funcionario</p>

      <form id="formLogin" novalidate>

        <div class="field" id="fieldLogin">
          <label for="inputLogin">Login</label>
          <div class="input-wrapper">
            <svg class="input-icon" viewBox="0 0 20 20" fill="none">
              <circle cx="10" cy="7" r="3" stroke="currentColor" stroke-width="1.5"/>
              <path d="M3 17c0-3.314 3.134-6 7-6s7 2.686 7 6" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
            </svg>
            <input type="text" id="inputLogin" placeholder="Seu login" autocomplete="username" required/>
          </div>
          <span class="field-error" id="erroLogin"></span>
        </div>

        <div class="field" id="fieldSenha">
          <label for="inputSenha">Senha</label>
          <div class="input-wrapper">
            <svg class="input-icon" viewBox="0 0 20 20" fill="none">
              <rect x="4" y="9" width="12" height="9" rx="2" stroke="currentColor" stroke-width="1.5"/>
              <path d="M7 9V6.5a3 3 0 0 1 6 0V9" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
            </svg>
            <input type="password" id="inputSenha" placeholder="Sua senha" autocomplete="current-password" required/>
            <button type="button" class="toggle-senha" id="toggleSenha" aria-label="Mostrar senha">
              <svg id="iconOlhoAberto" viewBox="0 0 20 20" fill="none">
                <path d="M2 10s3-6 8-6 8 6 8 6-3 6-8 6-8-6-8-6z" stroke="currentColor" stroke-width="1.5"/>
                <circle cx="10" cy="10" r="2.5" stroke="currentColor" stroke-width="1.5"/>
              </svg>
              <svg id="iconOlhoFechado" viewBox="0 0 20 20" fill="none" style="display:none">
                <path d="M3 3l14 14M8.5 8.6A2.5 2.5 0 0 0 12.4 12M6.3 6.4C4.3 7.6 2.7 9.5 2 10c1.3 2 4.3 5.5 8 5.5 1.3 0 2.5-.4 3.6-1M10 4.5C13.8 4.5 17 8 18 10c-.5.8-1.3 1.9-2.4 2.8" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
              </svg>
            </button>
          </div>
          <span class="field-error" id="erroSenha"></span>
        </div>

        <div class="error-box" id="erroGeral" aria-live="polite"></div>

        <button type="submit" class="btn-login" id="btnLogin">
          <span id="btnLoginTexto">Entrar</span>
          <svg id="btnLoginSpinner" class="spinner" viewBox="0 0 24 24" fill="none" style="display:none">
            <circle cx="12" cy="12" r="9" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="40 20"/>
          </svg>
        </button>
      </form>
    </div>

    <p class="login-footer">BusWay &copy; 2026</p>
  </div>
  <script src="js/login.js"></script>
</body>
</html>
